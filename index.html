<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iconic Tools</title>
<meta name="description" content="Small Windows tools by Iconic Tools.">
<style>
  :root { --bg: #f6f6f4; --fg: #1d1d1b; --muted: #5b5b57; --accent: #2f5fd0; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #202020; --fg: #ececea; --muted: #a9a9a4; --accent: #7399fe; color-scheme: dark; }
  }
  html { background: var(--bg); }
  body { margin: 0; padding: 2.5rem 1rem 4rem; background: var(--bg); color: var(--fg);
         font: 17px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif; }
  main { max-width: 40rem; margin: 0 auto; }
  h1 { font-size: 1.9rem; margin: 0 0 .5rem; }
  ul { padding-left: 1.2rem; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Iconic Tools</h1>
  <p>Small Windows tools for jobs that are boring, overwhelming or hard to start.</p>
  <ul>
    <li><a href="https://iconictoolsapp.gumroad.com/l/swipesorter">Swipe Sorter</a>: sort a messy folder one file at a time · <a href="privacy/">privacy policy</a></li>
  </ul>
  <p class="muted">Contact: <a href="mailto:iconictoolsapp@gmail.com">iconictoolsapp@gmail.com</a></p>
</main>
</body>
</html>
